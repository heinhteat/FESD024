<div class="text-center mb-4">
    <h1>Featured Courses</h1>
    <p>Specially promoted courses</p>
</div>

<div class="row">

    <div class="col-md-4 mb-4" *ngFor="let course of courses">

        <div class="card h-100 shadow-sm">

            <img [src]="course.courseImage" class="card-img-top" height="200">

            <div class="card-body">

                <h5 class="card-title">
                    {{ course.title }}
                </h5>

                <p class="card-text">
                    {{ course.description }}
                </p>

                <p>
                    <strong>Lecturer:</strong>
                    {{ course.lecturer }}
                </p>

                <p>
                    <strong>Duration:</strong>
                    {{ course.duration }} hours
                </p>

            </div>

        </div>

    </div>

</div>

<div class="text-center mt-3">
    <a routerLink="/courses" class="btn btn-primary">
        All Courses
    </a>
</div>
