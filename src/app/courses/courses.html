<h1 class="mb-4">All Courses</h1>

<div class="row">

    <div class="col-md-4 mb-4" *ngFor="let course of courses">

        <div class="card h-100">

            <img [src]="course.courseImage" class="card-img-top" height="200">

            <div class="card-body">

                <h5 class="card-title">
                    {{ course.title }}
                </h5>

                <p class="card-text">
                    {{ course.description }}
                </p>

                <p>
                    <strong>ID:</strong>
                    {{ course.courseId }}
                </p>

                <p>
                    <strong>Duration:</strong>
                    {{ course.duration }} hours
                </p>

                <p>
                    <strong>Lecturer:</strong>
                    {{ course.lecturer }}
                </p>

                <span class="badge bg-secondary">
                    {{ course.category }}
                </span>

            </div>

        </div>

    </div>

</div>
